name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'auditpulse-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'auditpulse-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Build & Test (Java 25 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run All Module Tests
        working-directory: auditpulse-backend
        run: mvn clean verify -Dspring.classformat.ignore=true
