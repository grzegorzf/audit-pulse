services:
  postgres:
    image: postgres:16-alpine
    container_name: auditpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditpulse
      POSTGRES_PASSWORD: auditpulse_secret
      POSTGRES_DB: auditpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditpulse -d auditpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./auditpulse-backend
      dockerfile: Dockerfile
    container_name: auditpulse-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      COINBASE_WEBSOCKET_URI: "wss://ws-feed.exchange.coinbase.com"
      COINBASE_WEBSOCKET_AUTO_START: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./auditpulse-frontend
      dockerfile: Dockerfile
    container_name: auditpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
